import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.ahmad.gbrowser'
    compileSdk 36

    defaultConfig {
        applicationId "com.ahmad.gbrowser"
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName "0.1"
        ndk { abiFilters "arm64-v8a" }
    }

    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword 'gbrowser123'
            keyAlias 'key0'
            keyPassword 'gbrowser123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    packaging {
        jniLibs { useLegacyPackaging = true }
    }

    // --- THIS IS NEW: TELLS ANDROID TO USE COMPOSE ---
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.11'
    }
    // -------------------------------------------------
}

kotlin {
    compilerOptions {
        jvmTarget.set(JvmTarget.JVM_17)
        freeCompilerArgs.add("-Xskip-metadata-version-check")
    }
}

dependencies {
    // Your original GeckoView 150.0
    implementation "org.mozilla.geckoview:geckoview:150.0.20260511200624"
    
    // --- THIS IS NEW: THE COMPOSE LIBRARIES ---
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'com.google.android.material:material:1.11.0'
}
