import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'kotlin-kapt'
}

android {
    namespace 'com.ahmad.gbrowser'
    compileSdk 36

    defaultConfig {
        applicationId "com.ahmad.gbrowser"
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName "0.1"
        ndk { abiFilters "arm64-v8a" }
    }

    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword 'gbrowser123'
            keyAlias 'key0'
            keyPassword 'gbrowser123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    packaging {
        jniLibs { useLegacyPackaging = true }
    }

    buildFeatures {
        compose true
    }
}

kotlin {
    compilerOptions {
        jvmTarget.set(JvmTarget.JVM_17)
        freeCompilerArgs.add("-Xskip-metadata-version-check")
    }
}

dependencies {
    // GeckoView
    implementation "org.mozilla.geckoview:geckoview:150.0.20260511200624"
    
    // Jetpack Compose
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'com.google.android.material:material:1.11.0'
    implementation "androidx.preference:preference-ktx:1.2.1"
    implementation("io.coil-kt:coil-compose:2.6.0")
    
    // --- CLINTGECKO ADM DEPENDENCIES ---
    // Room Database (for saving download state)
    implementation "androidx.room:room-runtime:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
    kapt "androidx.room:room-compiler:2.6.1"

    // WorkManager (for background downloads)
    implementation "androidx.work:work-runtime-ktx:2.9.0"

    // Coroutines (for the parallel downloader engine)
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    // OkHttp (Required by ClintDownloadManager for network requests)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
