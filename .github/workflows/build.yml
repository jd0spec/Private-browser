name: Build APK

on:
  push:
    paths:
      - 'GeckoBrowser/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: GeckoBrowser
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Keep the APK as a download
        uses: actions/upload-artifact@v4
        with:
          name: GeckoBrowser-apk
          path: GeckoBrowser/app/build/outputs/apk/release/*.apk

      - name: Publish APK on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Gecko Browser build ${{ github.run_number }}
          files: GeckoBrowser/app/build/outputs/apk/release/*.apk
