name: Unzip ADM Files
on: workflow_dispatch

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and Move Files
        run: |
          unzip -q adm.zip -d temp_adm
          mkdir -p GeckoBrowser/app/src/main/java/com/ahmad/gbrowser/downloads
          mv temp_adm/* GeckoBrowser/app/src/main/java/com/ahmad/gbrowser/downloads/
          rm -rf temp_adm adm.zip
          
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-unzipped ADM core files"
          git push
