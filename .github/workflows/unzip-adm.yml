name: Unzip ADM Files
on: workflow_dispatch
permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip files in place
        working-directory: GeckoBrowser/app/src/main/java/com/ahmad/gbrowser/downloads
        run: |
          unzip -o adm.zip
          rm adm.zip

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extracted ADM files in place"
          git push
